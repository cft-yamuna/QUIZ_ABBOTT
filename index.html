<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: installed and fullscreen, the app runs under the notch and
         env(safe-area-inset-*) (used by the fullscreen toggle) reports real values. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The 60-Second Talent Challenge</title>
    <meta name="description" content="Indeed FutureWorks quiz kiosk." />
    <!-- The app has one colour scheme, so one theme colour: the welcome screen's navy. -->
    <meta name="theme-color" content="#00123c" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <!-- iOS doesn't read manifest icons for the home screen, and needs these to launch without Safari's chrome. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Talent Challenge" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
